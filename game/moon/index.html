<body class="booting">
  <canvas id="view" aria-label="3D view of the Moon mission"></canvas>

  <!-- title / mission select -->
  <section id="menu" class="panel-screen" aria-labelledby="menu-title">
    <div class="menu-inner">
      <p class="eyebrow">Junior Astronaut · Zhetalis</p>
      <h1 id="menu-title">Moon Mission</h1>
      <p class="lede">Fly around the Moon with Orion, then train for a future landing near the lunar south pole.</p>
      <div class="mission-cards">
        <button class="mission-card" data-start="artemis1">
          <span class="tag real">Real mission · 2022</span><b>Artemis I flyby</b>
          <span>Uncrewed Orion test flight. Fly the far-side pass and take pictures with the wing cameras.</span>
          <small>Did not land</small>
        </button>
        <button class="mission-card" data-start="artemis2">
          <span class="tag real">Real mission · 2026</span><b>Artemis II flyby</b>
          <span>Four astronauts around the far side. Catch Earthset from the crew window.</span>
          <small>Did not land</small>
        </button>
        <button class="mission-card surface" data-start="surface">
          <span class="tag future">Future training scenario</span><b>South-pole surface training</b>
          <span>Land a white HLS-inspired lander, then manage power, oxygen, water and science.</span>
          <small id="resume-note">New mission</small>
        </button>
      </div>
      <div class="menu-row">
        <button id="resume-btn" class="primary" hidden>Resume surface mission</button>
        <button id="settings-btn">Settings</button>
        <button id="sources-btn">Data sources</button>
        <a class="button" href="index.html">Back to Mars</a>
      </div>
      <p class="data-note" id="data-note">Loading NASA data…</p>
    </div>
  </section>

  <!-- in-game HUD -->
  <div id="hud" hidden>
    <div class="window-frame" id="window-frame" hidden></div>   <!-- first, so every HUD panel paints above it -->
    <div class="hud-top-left">
      <div class="bars" id="bars"></div>
      <div class="suit" id="suit"></div>
    <section class="task objective collapsed" id="task" aria-label="Current objective">
      <button class="obj-head" id="obj-toggle" aria-expanded="false" aria-controls="obj-body">
        <small id="obj-count">Objective</small>
        <b id="obj-title"></b>
        <span class="obj-dist" id="obj-dist"></span>
      </button>
      <p class="obj-step" id="obj-step"></p>
      <div class="obj-body" id="obj-body">
        <p class="obj-detail" id="obj-detail"></p>
        <div class="obj-actions"><button id="obj-guide">Ask Zhetela</button><button id="obj-info">Information</button><button id="obj-log">Quest log (T)</button></div>
      </div>
    </section>
    </div>
    <div class="hud-top-center" id="clock"></div>
    <div class="hud-top-right">
      <canvas id="minimap" width="160" height="160" aria-label="Map: 240 metres across, north up"></canvas>
      <p class="map-legend" id="map-legend" hidden><i class="lg-target" aria-hidden="true"></i><span></span></p>
      <div class="hud-buttons">
        <button id="quest-btn" aria-label="Quest log (T)" aria-controls="quest-log" aria-expanded="false">☰</button>
        <button id="info-btn" aria-label="About this task">i</button>
        <button id="gear-btn" aria-label="Settings">⚙</button>
        <button id="pause-btn" aria-label="Pause">❚❚</button>
      </div>
    </div>

    <aside class="quest-log" id="quest-log" hidden role="dialog" aria-modal="false" aria-labelledby="ql-title">
      <header><h3 id="ql-title">Quest log</h3><button id="ql-close" aria-label="Close quest log">×</button></header>
      <div class="ql-body" id="ql-body"></div>
    </aside>
    <div class="alert-banner" id="alert" hidden></div>
    <div class="prompt" id="prompt" hidden><span></span><i class="hold"><b></b></i></div>
    <div class="fact-pop" id="fact-pop" hidden></div>
    <div class="caption" id="caption" hidden></div>
    <button class="skip" id="skip" hidden>Skip ▸</button>
    <!-- flyby -->
    <div class="flyby-hud" id="flyby-hud" hidden></div>
    <!-- cabin -->
    <div class="cabin" id="cabin" hidden></div>
    <!-- phone controls -->
    <div class="touch-ui">
      <div id="stick" aria-hidden="true"><i></i></div>
      <div class="touch-buttons">
        <button data-touch="jump" aria-label="Jump or photo">Jump</button>
        <button data-touch="use" aria-label="Use">Use</button>
        <button data-touch="rover" aria-label="Rover in or out">Rover</button>
        <button data-touch="lamp" aria-label="Lamp">Lamp</button>
      </div>
    </div>
  </div>

  <div id="modal" class="hidden"><div class="modal-box"></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="loading">Loading the Moon…</div>

  <script type="module" src="moon/src/main.js?v=mission-models-1"></script>
</body>
</html>
