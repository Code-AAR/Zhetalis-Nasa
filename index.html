<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zhetalis – Coming Soon</title>
  <style>
    :root { --bg:#05070f; --fg:#e8ecf5; --accent:#5ab0ff; --muted:#8a93a8; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(ellipse at 50% 120%, #14234a 0%, var(--bg) 60%);
      color: var(--fg);
      display:flex; align-items:center; justify-content:center;
      text-align:center; padding:24px; overflow:hidden;
    }
    .stars { position:fixed; inset:0; z-index:0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, #fff, transparent),
        radial-gradient(1px 1px at 70% 20%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 40% 70%, #cfe6ff, transparent),
        radial-gradient(1px 1px at 85% 60%, #fff, transparent),
        radial-gradient(1px 1px at 10% 80%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 60% 45%, #cfe6ff, transparent);
      background-size: 400px 400px; opacity:.7; }
    main { position:relative; z-index:1; max-width:560px; }
    h1 { font-size:clamp(2.2rem,7vw,3.8rem); letter-spacing:.04em; font-weight:700; }
    h1 span { color:var(--accent); }
    p { margin-top:16px; color:var(--muted); font-size:1.1rem; line-height:1.6; }
    .badge { display:inline-block; margin-top:28px; padding:8px 18px;
      border:1px solid var(--accent); border-radius:999px; color:var(--accent);
      font-size:.85rem; letter-spacing:.15em; text-transform:uppercase; }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main>
    <h1>Zhetalis <span>Space</span></h1>
    <p>Our website is on its way. Something out of this world is being assembled &mdash; check back soon.</p>
    <div class="badge">Coming Soon</div>
  </main>
</body>
</html>
